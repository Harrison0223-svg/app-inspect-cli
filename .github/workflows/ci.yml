name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Python 3.9 is no longer in ubuntu-latest's tool cache
          - os: ubuntu-22.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Install and smoke-test the CLI
        run: |
          python -m pip install .
          app-inspect --version
          app-inspect --help
      - name: MCP stdio smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | app-inspect mcp | python -c "import sys,json; r=[json.loads(l) for l in sys.stdin]; assert [m['id'] for m in r]==[1,2]; assert len(r[1]['result']['tools'])==4; print('mcp ok')"

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the composite action against the live App Store
        uses: ./
        with:
          app: "284882215"
          max-gap: "4"
